apiVersion: v1
kind: Service
metadata:
  name: {{ include "heartsense.fullname" . }}
  labels: {{- include "heartsense.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "heartsense.selectorLabels" . | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http, protocol: TCP}
