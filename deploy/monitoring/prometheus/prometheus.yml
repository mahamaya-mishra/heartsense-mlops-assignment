# Prometheus configuration for the HeartSense observability stack.
global:
  scrape_interval: 10s
  evaluation_interval: 15s
  external_labels: {cluster: minikube, project: heartsense}

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Every pod in the cluster that opts in with prometheus.io/scrape=true (the Helm chart adds
  # these annotations to the API pods). New replicas are discovered automatically.
  - job_name: heartsense-api
    kubernetes_sd_configs:
      - role: pod
        namespaces: {names: [heartsense]}
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
        target_label: release
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
